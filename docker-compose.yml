# Pokretanje: u fajlu .env pored ovog upišite DB_PASSWORD i DB_ROOT_PASSWORD (i PUBLIC_URL),
# pa docker compose up -d. Otvorite http://localhost:3000/admin i napravite nalog vlasnika;
# kod za prvo pokretanje je u ispisu servera: docker compose logs app.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: shopcrm
      DB_PASSWORD: ${DB_PASSWORD:?Upišite DB_PASSWORD u fajl .env pored docker-compose.yml}
      DB_NAME: shopcrm
      # Javna adresa, npr. https://prodavnica.rs — za linkove u emailovima i adrese slika u API-ju.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Kod za prvo pokretanje; prazno: napravi se sam i ispiše u docker compose logs app.
      SETUP_CODE: ${SETUP_CODE:-}
      # Koliko proxy-ja stoji ispred aplikacije (nginx, Cloudflare); vidi .env.example.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-1}
      MYSQLDUMP_PATH: mariadb-dump
    volumes:
      - uploads:/app/storage
      - backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: shopcrm
      MARIADB_USER: shopcrm
      MARIADB_PASSWORD: ${DB_PASSWORD:?Upišite DB_PASSWORD u fajl .env pored docker-compose.yml}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Upišite DB_ROOT_PASSWORD u fajl .env pored docker-compose.yml}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db:
  uploads:
  backups:
