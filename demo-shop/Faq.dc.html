<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Demo Shop — Česta pitanja</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./shop.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;600;700;800&amp;family=Red+Hat+Text:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="ds" style="font-family: 'Red Hat Text', 'Avenir Next', 'Helvetica Neue', sans-serif; color: #0E2730; background: #FFFFFF">
  <dc-import name="Header" hint-size="100%,100px"></dc-import>

  <section style="padding: clamp(48px, 6vw, 96px) 0 clamp(28px, 4vw, 48px)">
    <div class="wrap" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px 64px">
      <h1 class="display h-xl"><span class="ln"><span>Česta pitanja</span></span></h1>
      <p class="lead a1" style="max-width: 36ch; padding-bottom: 10px">Dostava, plaćanje, povrat i održavanje. Ako ne nađete odgovor, pišite nam.</p>
    </div>
  </section>

  <section style="padding-bottom: clamp(72px, 9vw, 128px)">
    <div class="wrap" style="display: flex; flex-wrap: wrap; gap: clamp(28px, 5vw, 88px); align-items: flex-start">
      <div class="sticky panel a2" style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 16px; padding: 22px">
        <div class="lab">Teme</div>
        <div role="group" aria-label="Teme" style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{topics}}" as="t" hint-placeholder-count="5">
            <button class="{{t.cls}}" onClick="{{t.pick}}" style="background-color: {{t.bg}}">{{t.label}}</button>
          </sc-for>
        </div>
      </div>
      <div style="flex: 999 1 520px; min-width: 0; border-top: 1px solid rgba(14, 39, 48, .1)">
        <sc-for list="{{items}}" as="q" hint-placeholder-count="5">
          <div class="{{q.cls}}">
            <button class="acc-h" aria-expanded="{{q.open}}" onClick="{{q.toggle}}"><span>{{q.q}}</span><span class="plus"></span></button>
            <div class="acc-b"><div><p>{{q.a}}</p></div></div>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <section style="padding-bottom: clamp(48px, 6vw, 88px)">
    <div class="wrap">
      <div class="dark rv" style="border-radius: 36px; padding: clamp(28px, 5vw, 64px); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 28px 64px">
        <div style="display: flex; flex-direction: column; gap: 12px; flex: 1 1 420px">
          <h2 class="display h-l">Niste našli odgovor?</h2>
          <p class="lead">Pišite nam ili pozovite. Odgovaramo istog radnog dana.</p>
        </div>
        <a class="btn gold" href="Contact.dc.html">Kontaktirajte nas
          <i><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h14M10 1l5 5-5 5"></path></svg></i>
        </a>
      </div>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,800px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2350}}'>
class Component extends DCLogic {
  state = { topic: 'Sve', open: 0 };
  componentDidMount() {
    if (!('IntersectionObserver' in window)) return;
    document.documentElement.classList.add('js');
    const io = new IntersectionObserver((es) => {
      es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -6% 0px' });
    this._io = io;
    document.querySelectorAll('.rv:not(.in)').forEach((el) => io.observe(el));
  }
  componentWillUnmount() { if (this._io) this._io.disconnect(); }
  renderVals() {
    const all = [
      { t: 'Dostava', q: 'Koliko traje isporuka?', a: 'Nameštaj izrađujemo po porudžbini, pa isporuka traje 5 do 10 radnih dana. Termin dostave dogovaramo telefonom dan ranije.' },
      { t: 'Dostava', q: 'Koliko košta dostava?', a: 'Dostava sa unošenjem i montažom je besplatna za porudžbine preko 50.000 RSD. Za manje iznose cena je 1.200 RSD, bez obzira na broj komada.' },
      { t: 'Dostava', q: 'Da li unosite i sastavljate nameštaj?', a: 'Da. Naš tim unosi komade u stan, sastavlja ih i odnosi ambalažu. Napišite nam sprat i da li zgrada ima lift.' },
      { t: 'Plaćanje', q: 'Koje načine plaćanja prihvatate?', a: 'Platnu karticu (Visa, Mastercard, Dina), plaćanje pouzećem i uplatu na račun. Sve cene su u dinarima, sa uračunatim PDV-om.' },
      { t: 'Plaćanje', q: 'Da li mogu da platim na rate?', a: '[Dopunite: banke, broj rata i uslovi plaćanja na rate.]' },
      { t: 'Povrat', q: 'Kako mogu da vratim proizvod?', a: 'Proizvod možete vratiti u roku od 30 dana od isporuke, neoštećen. Pišite nam i poslaćemo tim po njega.' },
      { t: 'Povrat', q: 'Kada dobijam novac nazad?', a: 'Novac vraćamo u roku od 14 dana od preuzimanja vraćenog proizvoda, na isti način na koji je porudžbina plaćena.' },
      { t: 'Proizvodi', q: 'Mogu li da dobijem uzorke tkanina?', a: 'Da, šaljemo do pet besplatnih uzoraka tkanina i drveta na vašu adresu. Poručite ih preko kontakt forme.' },
      { t: 'Proizvodi', q: 'Šta pokriva garancija?', a: 'Pet godina garancije pokriva konstrukciju, spojeve i mehanizme. Rezervne delove za svaki model čuvamo deset godina.' }
    ];
    const names = ['Sve', 'Dostava', 'Plaćanje', 'Povrat', 'Proizvodi'];
    const list = all.filter((x) => this.state.topic === 'Sve' || x.t === this.state.topic);
    return {
      topics: names.map((n) => ({ label: n, cls: n === this.state.topic ? 'chip on' : 'chip', bg: n === this.state.topic ? '#0E2730' : '#FFFFFF', pick: () => this.setState({ topic: n, open: 0 }) })),
      items: list.map((x, i) => ({ ...x, open: i === this.state.open ? 'true' : 'false', cls: i === this.state.open ? 'acc open' : 'acc', toggle: () => this.setState({ open: i === this.state.open ? -1 : i }) }))
    };
  }
}
</script>
</body>
</html>
